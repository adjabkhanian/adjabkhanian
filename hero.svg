<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img"><title>hero</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20201e} .muted{fill:#77756c}.enter{animation:enter .9s cubic-bezier(.2,.7,.2,1) both}.delay{animation-delay:.2s}.float{animation:float 5s ease-in-out infinite}.cell{animation:cell .6s both;transform-box:fill-box;transform-origin:center}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes cell{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="999" height="369" rx="24" fill="#f6f5f0" stroke="#deddd5"/><text x="40" y="48" font-size="13" class="muted" >ADJABKHANIAN / DESIGN &amp; DEVELOPMENT</text><g class="enter"><text x="40" y="133" font-size="76" class="" letter-spacing="-4">Hovik</text><text x="40" y="218" font-size="76" class="" letter-spacing="-4">Adjabkhanian.</text></g><text x="43" y="278" font-size="24" class="enter delay" >Сайты, Telegram-боты и автоматизация.</text><text x="43" y="321" font-size="17" class="muted" >От идеи и интерфейса — до работающего продукта.</text><g class="float"><rect x="806" y="100" width="144" height="144" rx="36" fill="#222320"/><path d="M843 199L878 140L913 199M856 181H900" fill="none" stroke="#d6ed86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>