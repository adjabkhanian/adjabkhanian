name: Refresh profile cards
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render self-contained animated cards
        run: |
          python - --refresh <<'PYTHON'
          """Render self-contained animated SVGs. STATIC=1 disables motion."""
          from pathlib import Path
          import os,json,re,urllib.request,html,datetime,collections
          ROOT=Path.cwd()
          CARDS=ROOT;CARDS.mkdir(exist_ok=True)
          STATIC=os.getenv('STATIC')=='1'
          def fetch():
           req=urllib.request.Request('https://github.com/users/adjabkhanian/contributions',headers={'User-Agent':'adjabkhanian-profile'})
           s=urllib.request.urlopen(req,timeout=30).read().decode()
           tips={m[0]:m[1] for m in re.findall(r'<tool-tip[^>]*for="([^"]+)"[^>]*>(.*?)</tool-tip>',s,re.S)}
           days=[]
           for tag in re.findall(r'<td[^>]*data-date[^>]*>',s):
            attrs=dict(re.findall(r'([\w-]+)="([^"]*)"',tag))
            text=html.unescape(tips.get(attrs['id'],'')); count=re.match(r'(\d+) contribution',text)
            if not text:raise ValueError('Missing contribution tooltip')
            days.append({'date':attrs['data-date'],'count':int(count[1]) if count else 0})
           if len(days)<300:raise ValueError('Incomplete contribution calendar')
           (ROOT/'contributions.json').write_text(json.dumps(sorted(days,key=lambda d:d['date']),indent=2)+'\n')
          def svg(name,w,h,body):
           css='''text{font-family:Arial,Helvetica,sans-serif;fill:#20201e} .muted{fill:#77756c}.enter{animation:enter .9s cubic-bezier(.2,.7,.2,1) both}.delay{animation-delay:.2s}.float{animation:float 5s ease-in-out infinite}.cell{animation:cell .6s both;transform-box:fill-box;transform-origin:center}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes cell{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}'''
           if STATIC:css+='*{animation:none!important}'
           (CARDS/(name+'.svg')).write_text(f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}" role="img"><title>{html.escape(name)}</title><style>{css}</style>{body}</svg>')
          def t(x,y,s,size=16,cls='',extra=''):return f'<text x="{x}" y="{y}" font-size="{size}" class="{cls}" {extra}>{html.escape(s)}</text>'
          def bg(w,h,c='#f6f5f0'):return f'<rect x=".5" y=".5" width="{w-1}" height="{h-1}" rx="24" fill="{c}" stroke="#deddd5"/>'
          def render():
           svg('hero',1000,370,bg(1000,370)+t(40,48,'ADJABKHANIAN / DESIGN & DEVELOPMENT',13,'muted')+'<g class="enter">'+t(40,133,'Hovik',76,extra='letter-spacing="-4"')+t(40,218,'Adjabkhanian.',76,extra='letter-spacing="-4"')+'</g>'+t(43,278,'Сайты, Telegram-боты и автоматизация.',24,'enter delay')+t(43,321,'От идеи и интерфейса — до работающего продукта.',17,'muted')+'<g class="float"><rect x="806" y="100" width="144" height="144" rx="36" fill="#222320"/><path d="M843 199L878 140L913 199M856 181H900" fill="none" stroke="#d6ed86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>')
           for name,num,title,sub,color,icon in [('build','01','Продукты','Сервисы и приложения','#deebfa','&lt;/&gt;'),('design','02','Дизайн','Интерфейсы и детали','#f3e0d8','Aa'),('automate','03','Автоматизация','Боты и рабочие процессы','#e8edce','↗')]:
            svg(name,320,225,bg(320,225,color)+t(24,38,num,12,'muted')+f'<text x="260" y="45" font-size="24">{icon}</text><g class="enter">'+t(24,136,title,29,extra='letter-spacing="-1"')+t(24,173,sub,14,'muted')+'</g>')
           projects=[('clubops','ClubOps','Управление компьютерным клубом','Смены · QR · отчёты · Windows','#dcecaa'),('vpn','222VPN','VPN-сервис и личный кабинет','Подписки · Telegram · инфраструктура','#d6e8f7'),('bots','Telegram-боты','Меньше рутины. Больше порядка.','Задачи · уборка · расчёт зарплаты','#e7def2')]
           for name,title,desc,stack,color in projects:
            svg(name,1000,178,bg(1000,178)+f'<rect x="20" y="20" width="8" height="138" rx="4" fill="{color}"/>'+'<g class="enter">'+t(48,61,title,32,extra='font-weight="700" letter-spacing="-1"')+t(48,101,desc,21)+t(48,140,stack,15,'muted')+'</g>'+t(927,65,'↗',32))
           data=json.loads((ROOT/'contributions.json').read_text());counts=[x['count'] for x in data]; total=sum(counts);active=sum(c>0 for c in counts)
           body=bg(1000,280)+t(32,43,'GITHUB / РЕАЛЬНАЯ АКТИВНОСТЬ',13,'muted')+t(32,93,str(total),38)+t(100,92,'вклад за год · активных дней: '+str(active),15,'muted')
           first=datetime.date.fromisoformat(data[0]['date']);start=first-datetime.timedelta(days=(first.weekday()+1)%7)
           palette=['#e8e7df','#bccf9a','#8ba866','#587b3c','#2e5023']
           for i,d in enumerate(data):
            day=datetime.date.fromisoformat(d['date']);n=(day-start).days;v=d['count'];level=0 if not v else 1 if v<3 else 2 if v<6 else 3 if v<10 else 4
            body+=f'<rect class="cell" style="animation-delay:{(n//7)*.012:.3f}s" x="{32+(n//7)*17}" y="{123+(n%7)*17}" width="13" height="13" rx="3" fill="{palette[level]}"><title>{d["date"]}: {v}</title></rect>'
           body+=t(32,264,'Публичный календарь GitHub · '+data[0]['date']+' — '+data[-1]['date'],12,'muted')
           svg('activity',1000,280,body)
          if __name__=='__main__':
           import sys
           if '--refresh' in sys.argv:fetch()
           render()
          PYTHON
      - name: Save current activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.svg' contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile cards"
            git push
          fi
