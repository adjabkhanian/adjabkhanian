<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="178" viewBox="0 0 1000 178" role="img"><title>vpn</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20201e} .muted{fill:#77756c}.enter{animation:enter .9s cubic-bezier(.2,.7,.2,1) both}.delay{animation-delay:.2s}.float{animation:float 5s ease-in-out infinite}.cell{animation:cell .6s both;transform-box:fill-box;transform-origin:center}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes cell{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="999" height="177" rx="24" fill="#f6f5f0" stroke="#deddd5"/><rect x="20" y="20" width="8" height="138" rx="4" fill="#d6e8f7"/><g class="enter"><text x="48" y="61" font-size="32" class="" font-weight="700" letter-spacing="-1">222VPN</text><text x="48" y="101" font-size="21" class="" >VPN-сервис и личный кабинет</text><text x="48" y="140" font-size="15" class="muted" >Подписки · Telegram · инфраструктура</text></g><text x="927" y="65" font-size="32" class="" >↗</text></svg>